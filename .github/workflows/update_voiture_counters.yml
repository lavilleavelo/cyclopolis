name: Update Voiture Counters

on:
  workflow_dispatch:
  schedule:
    - cron: '7 16 1 * *'

# La PR est créée avec un token GitHub App (cyclopolis-bot) pour que ça lance la CI
permissions:
  contents: read

jobs:
  update_counters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Update Counters Script
        run: node .github/scripts/update-voiture-counters.js

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: '[Automatique] Mise à jour des compteurs voiture'
          title: 'Compteurs - Mise à jour automatique des compteurs voiture'
          body: 'Mise à jour automatique des compteurs via une github action.'
          base: main
          branch: update-counters-${{ github.run_id }}
          delete-branch: true
          reviewers: StephaneColson
